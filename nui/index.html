<html>
    <head>
        <meta charset="UTF-8">

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
        
        <!-- JQuery -->
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
        
        <!-- Stylesheets -->
        <link rel="stylesheet" href="css/theme.css">
        <link id="utils-css-light" rel="stylesheet" href="css/light-style.css" disabled>
        <link id="utils-css-dark" rel="stylesheet" href="css/dark-style.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/tooltip.css">
        <link rel="stylesheet" href="css/navigation-tabs.css">
        <link rel="stylesheet" href="css/progress.css">
    </head>
    <body>
        <div id="progress-bar-wrapper">
            <div class="pb-card">
                <div class="pb-header status">
                    <div class="pb-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle class="pb-ring-bg" cx="12" cy="12" r="9"></circle>
                            <circle class="pb-ring" cx="12" cy="12" r="9"></circle>
                            <path class="pb-check" d="M7.8 12.4l2.9 2.9 5.5-5.8"></path>
                        </svg>
                    </div>
                    <div class="pb-text">
                        <div class="pb-label state"></div>
                        <div class="pb-time">0.0s</div>
                    </div>
                    <div class="pb-percent percentage">
                        <span class="pb-num">0</span><span class="pb-sign">%</span>
                    </div>
                </div>
                <div class="pb-track loading-bar">
                    <div class="pb-fill progress-bar"></div>
                </div>
            </div>
        </div>

        <script src="index.js" type="text/javascript"></script>
        <script src="js/progress.js" type="text/javascript"></script>
        <script src="js/notification.js" type="text/javascript"></script>
    </body>
</html>
